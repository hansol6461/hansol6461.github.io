description: >-
  Hansol Lee is Professor of English at the Korea Military Academy. Research on
  meta-analysis and research synthesis in second language learning, the simple view
  of reading, English-medium instruction, AI in language learning, and military English.
description_ko: >-
  이한솔은 육군사관학교 영어과 교수입니다. 제2언어 학습 메타분석과 연구 종합, 읽기 단순 관점
  모형, 영어 매개 수업, 언어 학습에서의 인공지능, 군사영어를 연구합니다.

