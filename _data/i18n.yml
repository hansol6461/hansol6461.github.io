ko_intro:
  label: "국문 소개"
  # 행님이 직접 쓰신 문장입니다.
  body: >-
    이한솔 교수는 현재 육군사관학교의 영어 교수로 재직 중입니다. 캘리포니아대학교 어바인에서 교육학
    박사학위를 받았고 옥스퍼드대학교 교육학과 객원교수를 지냈습니다. 교육공학,
    교육심리학, 응용언어학을 함께 다루며, 메타분석을 비롯한 양적 연구 방법으로 학습의
    기제를 밝히는 연구를 해 왔습니다. 리터러시(문해력)를 중심으로 인공지능 활용 언어
    학습, 영어 매개 수업, 제2언어 읽기, 특수목적영어(군사영어)가 주요 연구 주제입니다.
    다양한 군 관련 주제의 연구과제에 참여하며 한영 및 영한 번역 사업도 수행하고 있습니다.
