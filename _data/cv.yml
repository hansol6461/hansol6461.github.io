# 연구 관심 분야 — 상단 개요에서 사용
lines:
  - en: "Research synthesis and meta-analysis"
    ko: "연구 종합과 메타분석"
    body_en: "Multilevel meta-analysis and meta-analytic structural equation modelling applied to second language learning. Reading, vocabulary, writing programmes, and classroom interventions."
    body_ko: "제2언어 학습을 대상으로 한 다층 메타분석과 메타분석 구조방정식 모형. 읽기, 어휘, 쓰기 프로그램, 교실 수업 개입을 다룹니다."
    venues: "Review of Educational Research · Educational Research Review · Applied Linguistics"
  - en: "Literacy and the simple view of reading"
    ko: "문해력과 읽기 단순 관점 모형"
    body_en: "Decoding and linguistic comprehension as components of second language reading, and how their relative weight shifts with learner age and proficiency."
    body_ko: "제2언어 읽기의 구성 요소인 해독과 언어 이해, 그리고 학습자의 나이와 숙달도에 따라 두 요소의 상대적 비중이 어떻게 달라지는지를 다룹니다."
    venues: "Scientific Studies of Reading · Review of Educational Research · Child Development"
  - en: "Technology and AI in language learning"
    ko: "언어 학습에서의 기술과 인공지능"
    body_en: "Corpus-based and data-driven learning, chatbots, social robots, and AI-guided individualised instruction — what they do for learning and how learners judge them."
    body_ko: "코퍼스 기반 학습과 데이터 기반 학습, 챗봇, 소셜 로봇, 인공지능 기반 개인 맞춤형 수업이 학습에 미치는 효과와 학습자가 이를 평가하는 방식을 다룹니다."
    venues: "The Modern Language Journal · Language Learning & Technology · ReCALL"
  - en: "English-medium instruction"
    ko: "영어 매개 수업"
    body_en: "Whether teaching subject content in English helps language learning without costing content learning, across primary, secondary, and tertiary settings."
    body_ko: "교과 내용을 영어로 가르치는 방식이 내용 학습을 저해하지 않으면서 언어 학습에 도움이 되는지를 초등, 중등, 고등 교육 단계에 걸쳐 검토합니다."
    venues: "System · Educational Research Review · Studies in Second Language Learning and Teaching"
  - en: "English for specific purposes (Military English)"
    ko: "특수목적영어 (군사영어)"
    body_en: "Corpus studies of military vocabulary, ESP assessment for cadets, and communication training for ROK-US combined operations."
    body_ko: "군사 어휘 코퍼스 연구, 생도를 대상으로 한 특수목적영어 평가, 한미 연합작전을 위한 의사소통 훈련을 다룹니다."
    venues: "Korean Journal of Military Arts and Science · The Defence Horizon Journal"

