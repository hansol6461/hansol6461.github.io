name: Sync publications

on:
  schedule:
    - cron: "0 18 * * 0"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PyYAML
        run: pip install --quiet pyyaml
      - name: Sync from OpenAlex
        run: python3 scripts/sync_publications.py
      - name: Commit if changed
        run: |
          if git diff --quiet -- _data/publications.yml; then
            echo "no changes"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _data/publications.yml
          git commit -m "Sync publications ($(date -u +%Y-%m-%d))"
          git push
